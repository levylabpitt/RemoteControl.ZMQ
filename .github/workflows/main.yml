name: Sync issue labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
  workflow_dispatch:

jobs:
  labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Create or update labels from .github/labels.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const wanted = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 });
            const byName = new Map(existing.map(l => [l.name.toLowerCase(), l]));

            for (const label of wanted) {
              const color = label.color.replace(/^#/, '').toLowerCase();
              const description = label.description ?? '';
              const current = byName.get(label.name.toLowerCase());
              if (!current) {
                await github.rest.issues.createLabel({ owner, repo, name: label.name, color, description });
                core.info(`Created: ${label.name}`);
              } else if (current.name !== label.name || current.color !== color || (current.description ?? '') !== description) {
                await github.rest.issues.updateLabel({ owner, repo, name: current.name, new_name: label.name, color, description });
                core.info(`Updated: ${label.name}`);
              } else {
                core.info(`Unchanged: ${label.name}`);
              }
            }
